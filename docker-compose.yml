services:
  db:
    image: postgres:16-alpine
    container_name: gym-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_dev_password
      POSTGRES_DB: gym_crm
    ports:
      - "5432:5432"
    volumes:
      - gym_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gym_crm_pgdata: